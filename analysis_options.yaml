# DRAIS Mobile — static analysis configuration.
#
# Mirrors the intent of the LongTerm ESLint/TypeScript gates: no implicit
# dynamics crossing a layer boundary, no silent failures, explicit types on
# public API. Run `flutter analyze` before every push (see CONTRIBUTING.md).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A silently swallowed future is the mobile equivalent of an unawaited
    # DB write in LongTerm — promote it to an error.
    unawaited_futures: error
    todo: ignore
  exclude:
    - build/**
    - "**/*.g.dart"
    # Separate Dart package with its own analysis_options.yaml.
    - server/**

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Null safety / immutability
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # Style — matches the LongTerm house style (single quotes, trailing commas)
    prefer_single_quotes: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
    use_super_parameters: true

    # ── Deliberately disabled, with reasons ────────────────────────────────
    #
    # directives_ordering wants one alphabetically-sorted import block. This
    # project groups imports instead — dart:, then external packages, then
    # package:drais — which makes the dependency direction of a file legible
    # at a glance and mirrors the import convention in DRAIS LongTerm's
    # TypeScript sources. Sorting is still enforced *within* each group by
    # review.
    directives_ordering: false
    #
    # prefer_initializing_formals fires on `_field = namedParam` in
    # constructors. Using `this._field` instead would make the private name
    # part of the public named-argument API, which is worse for callers than
    # the assignment it saves.
    prefer_initializing_formals: false

    # Layering — no production code may print directly; use AppLogger.
    avoid_print: true
