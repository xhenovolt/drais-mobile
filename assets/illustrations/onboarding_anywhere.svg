<!--
  DRAIS onboarding — "Your school's records, wherever you are".

  A phone connected to the school, and to DRAIS in the cloud. Deliberately
  shows both paths, because both are real deployments: a school server on the
  local network, or hosted DRAIS. The app supports either without a rebuild.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <circle cx="140" cy="112" r="86" fill="#2563EB" fill-opacity="0.06"/>

  <!-- Cloud -->
  <path d="M104 62a20 20 0 0 1 38.6-7.4A16 16 0 0 1 168 62a15 15 0 0 1-1.6 29.9H106
           A15 15 0 0 1 104 62z"
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M126 72.5l6 6 13-13.5" stroke="#2563EB" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="84" width="40" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Connection: cloud to phone -->
  <path d="M140 96v18" stroke="#2563EB" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- Phone -->
  <rect x="112" y="116" width="56" height="88" rx="11"
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M112 127a11 11 0 0 1 11-11h34a11 11 0 0 1 11 11v9h-56z" fill="#2563EB"/>
  <rect x="121" y="146" width="30" height="4.5" rx="2.25" fill="#334155"/>
  <rect x="121" y="156" width="38" height="4.5" rx="2.25" fill="#E2E8F0"/>
  <rect x="121" y="166" width="22" height="4.5" rx="2.25" fill="#E2E8F0"/>
  <circle cx="157" cy="185" r="8" fill="#16A34A" fill-opacity="0.16"/>
  <path d="M153.6 185.2l2.4 2.4 4.6-4.8" stroke="#16A34A" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- School building, left -->
  <path d="M28 148l26-15 26 15v46H28z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M28 148l26-15 26 15" fill="#2563EB" fill-opacity="0.12"/>
  <rect x="40" y="160" width="10" height="10" rx="2" fill="#0EA5E9" fill-opacity="0.35"/>
  <rect x="58" y="160" width="10" height="10" rx="2" fill="#0EA5E9" fill-opacity="0.35"/>
  <rect x="47" y="178" width="14" height="16" rx="2" fill="#2563EB" fill-opacity="0.28"/>
  <path d="M54 133v-9m0 0h9" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Local-network link -->
  <path d="M82 172h26" stroke="#0EA5E9" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- Signal arcs from the school -->
  <path d="M88 158a14 14 0 0 1 0-20" stroke="#0EA5E9" stroke-width="2"
        stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M96 164a24 24 0 0 1 0-32" stroke="#0EA5E9" stroke-width="2"
        stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Database, right -->
  <ellipse cx="222" cy="140" rx="24" ry="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M198 140v34c0 5 10.7 9 24 9s24-4 24-9v-34"
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="222" cy="157" rx="24" ry="9" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="222" cy="140" r="4" fill="#2563EB" fill-opacity="0.5"/>

  <!-- Cloud-to-database link -->
  <path d="M176 96c18 10 34 20 42 34" stroke="#2563EB" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="1 7"/>
</svg>
