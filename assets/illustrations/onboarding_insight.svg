<!--
  DRAIS onboarding — "Know your school at a glance".

  A weekly attendance chart with a present/late/absent breakdown, the numbers
  a head teacher actually looks at. Bars use the same status colours the
  attendance screens do, so the meaning is learned once.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <circle cx="140" cy="106" r="88" fill="#0EA5E9" fill-opacity="0.07"/>

  <!-- Card -->
  <rect x="44" y="34" width="192" height="150" rx="14"
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Card header -->
  <rect x="60" y="50" width="60" height="6" rx="3" fill="#334155"/>
  <rect x="60" y="62" width="38" height="4" rx="2" fill="#94A3B8"/>
  <rect x="186" y="48" width="34" height="18" rx="9" fill="#2563EB" fill-opacity="0.1"/>
  <path d="M195 60l4-5 3.5 3 5-6" stroke="#2563EB" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Baseline -->
  <rect x="60" y="146" width="160" height="1.5" rx="0.75" fill="#E2E8F0"/>

  <!-- Bars: Mon–Fri, present stacked with late -->
  <rect x="66" y="106" width="16" height="40" rx="4" fill="#16A34A"/>
  <rect x="66" y="96"  width="16" height="12" rx="4" fill="#D97706"/>

  <rect x="96" y="98"  width="16" height="48" rx="4" fill="#16A34A"/>
  <rect x="96" y="90"  width="16" height="10" rx="4" fill="#D97706"/>

  <rect x="126" y="116" width="16" height="30" rx="4" fill="#16A34A"/>
  <rect x="126" y="102" width="16" height="16" rx="4" fill="#D97706"/>
  <rect x="126" y="94"  width="16" height="10" rx="4" fill="#DC2626"/>

  <rect x="156" y="92"  width="16" height="54" rx="4" fill="#16A34A"/>
  <rect x="156" y="84"  width="16" height="10" rx="4" fill="#D97706"/>

  <rect x="186" y="110" width="16" height="36" rx="4" fill="#16A34A"/>
  <rect x="186" y="100" width="16" height="12" rx="4" fill="#D97706"/>

  <!-- Day labels -->
  <rect x="68" y="154" width="12" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="98" y="154" width="12" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="128" y="154" width="12" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="158" y="154" width="12" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="188" y="154" width="12" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Legend -->
  <circle cx="66" cy="172" r="3.5" fill="#16A34A"/>
  <rect x="74" y="169" width="24" height="4.5" rx="2.25" fill="#94A3B8"/>
  <circle cx="112" cy="172" r="3.5" fill="#D97706"/>
  <rect x="120" y="169" width="18" height="4.5" rx="2.25" fill="#94A3B8"/>
  <circle cx="152" cy="172" r="3.5" fill="#DC2626"/>
  <rect x="160" y="169" width="24" height="4.5" rx="2.25" fill="#94A3B8"/>

  <!-- Floating stat chip -->
  <rect x="182" y="18" width="72" height="34" rx="12" fill="#2563EB"/>
  <rect x="194" y="27" width="30" height="7" rx="3.5" fill="#FFFFFF"/>
  <rect x="194" y="38" width="46" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.65"/>
  <path d="M236 32l4-5 4 5" stroke="#FFFFFF" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
