<!--
  DRAIS onboarding — "Mark attendance in seconds".

  A class roll on a phone: three learners marked present, one late.
  Palette is DRAIS's own (globals.css): primary #2563EB, success #16A34A,
  warning #D97706, borders #E2E8F0.

  Drawn on a transparent background with a soft tinted card behind the phone,
  so the same file reads on the light gradient and the dark one. No pure
  white or pure black is used for that reason.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <!-- Soft brand halo -->
  <circle cx="140" cy="106" r="88" fill="#2563EB" fill-opacity="0.07"/>
  <circle cx="140" cy="106" r="62" fill="#2563EB" fill-opacity="0.05"/>

  <!-- Phone body -->
  <rect x="86" y="24" width="108" height="172" rx="16"
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="86" y="24" width="108" height="172" rx="16"
        fill="#2563EB" fill-opacity="0.02"/>

  <!-- Header bar -->
  <path d="M86 40a16 16 0 0 1 16-16h76a16 16 0 0 1 16 16v18H86z" fill="#2563EB"/>
  <rect x="98" y="36" width="42" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="98" y="45" width="26" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="172" cy="42" r="7" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Roll rows: avatar, name bar, status pill -->
  <!-- present -->
  <circle cx="104" cy="76" r="8" fill="#16A34A" fill-opacity="0.16"/>
  <circle cx="104" cy="76" r="8" stroke="#16A34A" stroke-width="1.5"/>
  <path d="M100.5 76.2l2.4 2.4 4.6-4.8" stroke="#16A34A" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="71" width="40" height="5" rx="2.5" fill="#334155"/>
  <rect x="118" y="80" width="24" height="4" rx="2" fill="#94A3B8"/>
  <rect x="164" y="72" width="20" height="10" rx="5" fill="#16A34A" fill-opacity="0.14"/>
  <circle cx="174" cy="77" r="3" fill="#16A34A"/>

  <!-- present -->
  <circle cx="104" cy="104" r="8" fill="#16A34A" fill-opacity="0.16"/>
  <circle cx="104" cy="104" r="8" stroke="#16A34A" stroke-width="1.5"/>
  <path d="M100.5 104.2l2.4 2.4 4.6-4.8" stroke="#16A34A" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="99" width="48" height="5" rx="2.5" fill="#334155"/>
  <rect x="118" y="108" width="20" height="4" rx="2" fill="#94A3B8"/>
  <rect x="164" y="100" width="20" height="10" rx="5" fill="#16A34A" fill-opacity="0.14"/>
  <circle cx="174" cy="105" r="3" fill="#16A34A"/>

  <!-- late -->
  <circle cx="104" cy="132" r="8" fill="#D97706" fill-opacity="0.16"/>
  <circle cx="104" cy="132" r="8" stroke="#D97706" stroke-width="1.5"/>
  <path d="M104 128.4v3.8l2.6 1.6" stroke="#D97706" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="127" width="36" height="5" rx="2.5" fill="#334155"/>
  <rect x="118" y="136" width="28" height="4" rx="2" fill="#94A3B8"/>
  <rect x="164" y="128" width="20" height="10" rx="5" fill="#D97706" fill-opacity="0.16"/>
  <circle cx="174" cy="133" r="3" fill="#D97706"/>

  <!-- present -->
  <circle cx="104" cy="160" r="8" fill="#16A34A" fill-opacity="0.16"/>
  <circle cx="104" cy="160" r="8" stroke="#16A34A" stroke-width="1.5"/>
  <path d="M100.5 160.2l2.4 2.4 4.6-4.8" stroke="#16A34A" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="155" width="44" height="5" rx="2.5" fill="#334155"/>
  <rect x="118" y="164" width="18" height="4" rx="2" fill="#94A3B8"/>
  <rect x="164" y="156" width="20" height="10" rx="5" fill="#16A34A" fill-opacity="0.14"/>
  <circle cx="174" cy="161" r="3" fill="#16A34A"/>

  <!-- Floating confirmation tick -->
  <circle cx="206" cy="62" r="19" fill="#16A34A"/>
  <path d="M198.5 62.5l5 5 10-10.5" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Speed marks -->
  <rect x="42" y="70" width="26" height="5" rx="2.5" fill="#0EA5E9" fill-opacity="0.5"/>
  <rect x="52" y="84" width="16" height="5" rx="2.5" fill="#0EA5E9" fill-opacity="0.32"/>
  <rect x="34" y="98" width="34" height="5" rx="2.5" fill="#0EA5E9" fill-opacity="0.2"/>
</svg>
